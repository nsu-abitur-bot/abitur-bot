# Хуки Orca для abitur-bot.
# Запускаются при создании нового воркспейса (worktree), cwd — новый воркспейс.
# Доступные переменные: $ORCA_ROOT_PATH (корневой чекаут репы), $ORCA_WORKTREE_PATH.

scripts:
  setup: |
    set -e

    # .env и локальные данные не в git — подтягиваем из корневого воркспейса,
    # иначе новый воркспейс не стартует (нет токенов, доступа к БД, справочников).
    for f in .env faq/faq_data.yaml abbrev/abbrev_data.yaml; do
      if [ ! -e "$f" ] && [ -e "$ORCA_ROOT_PATH/$f" ]; then
        mkdir -p "$(dirname "$f")"
        cp "$ORCA_ROOT_PATH/$f" "$f"
      fi
    done

    # Своё venv на воркспейс: ветки могут расходиться по зависимостям,
    # а из кеша uv это почти бесплатно.
    uv sync

# Не пускать агента в воркспейс, пока не отработал uv sync:
# иначе первые же `uv run` идут в полупустое окружение.
setupAgentStartupPolicy: wait-for-setup

worktree:
  sharedDirectories:
    # Хранилище LightRAG (~6 МБ): переиндексация стоит времени и вызовов API,
    # поэтому воркспейсы делят один индекс с корневым.
    - data
    # logs НЕ шарим — иначе вывод разных веток мешается в одном файле.

# Важно: БД — общий PostgreSQL из .env, отдельного инстанса на воркспейс нет.
# `alembic upgrade head` из ветки затронет и остальные воркспейсы.
# Telegram-поллинг тоже один на токен: не запускайте main.py в двух воркспейсах разом.
