services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-abitur}
      - DB_HOST=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # If running LLM on host machine (e.g. LM Studio), use http://host.docker.internal:1234/v1
      # - LM_API_URL=http://host.docker.internal:1234/v1
    volumes:
      - ./faq:/app/faq
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build: .
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-abitur}
      - DB_HOST=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # Без ключа compose не стартует: иначе api молча перезапускался бы по кругу
      # (restart: always), а проверка в api/auth/security.py видна только в логах.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in .env}
    # Порт открыт на всех интерфейсах: админка (abitur-web) ходит в API напрямую
    # по адресу сервера. Закрыть его на 127.0.0.1 можно только вместе с
    # реверс-прокси и переключением NUXT_PUBLIC_API_BASE_URL на него.
    ports:
      - "8000:8000"
    volumes:
      - ./faq:/app/faq
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build: .
    restart: always
    command: python -m scheduler.main
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-abitur}
      - DB_HOST=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:alpine
    restart: always
    # Порт наружу не публикуется: сервисы ходят по имени redis внутри сети compose.
    # Пароль — защита в глубину: история чатов в Redis — часть промпта, её потеря роняет бота
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
    environment:
      # redis-cli берёт пароль из REDISCLI_AUTH — так он не попадает в аргументы
      # процесса проверки здоровья.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-abitur}
    # Порт наружу не публикуется: сервисы ходят по имени postgres внутри сети compose
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-abitur}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  postgres_data:
