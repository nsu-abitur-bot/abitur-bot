schema_version: 1
scenarios:
- id: nsu-summer-bachelor-01
  question: Есть две программы с одинаковым кодом. Это разные программы или одна?
  reference_answer: 'Это два разных профиля одного направления 09.03.01 «Информатика и вычислительная
    техника»: «Программная инженерия и компьютерные науки» (ПИиКН) и «Компьютерные науки и
    системотехника» (КНиС). Одинаковый код не делает их одной программой.'
  topic: program_identity
  source: https://education.nsu.ru/information-technologies/
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: выбирает ПИиКН и КНиС на ФИТ НГУ. Нужны факты: два разных профиля
    одного направления; код 09.03.01; направление «Информатика и вычислительная техника».
    Нельзя объявлять конкурс общим или раздельным на основании одного кода. Содержательный
    ответ обязателен; просьба уточнить вместо этих фактов не проходит. Допустимы разные названия/порядок
    перечисления профилей.'
  min_score: 4
  history:
  - role: user
    content: Я выбираю между ПИиКН и КНиС на ФИТ НГУ.
- id: nsu-summer-bachelor-03
  question: Как заключить договор на платное обучение?
  reference_answer: 'Договор на платное обучение ФИТ можно оформить дистанционно: напишите
    в приёмную комиссию ФИТ на fit_prkom@nsu.ru по вопросу заключения договора. Для очного
    оформления на странице ФИТ указан кабинет 1132 учебного корпуса №1, Пирогова, 1. Дальнейшие
    документы и порядок подписания нужно согласовать с комиссией; на странице нет полного
    дистанционного регламента.'
  topic: paid_contract
  source: https://education.nsu.ru/apply_fit
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: поступающий на бакалавриат ФИТ хочет дистанционный договор. Обязательны
    возможность дистанционного оформления и конкретный адрес fit_prkom@nsu.ru для обращения
    по договору. Кабинет и адрес очного оформления допустимы, но необязательны. Нельзя придумывать
    перечень документов, срок подписания, обязательный очный визит или обещать зачисление.
    Один ответ «уточните в комиссии» без возможности дистанционного договора и адреса не проходит.'
  min_score: 4
  history:
  - role: user
    content: Я поступаю на бакалавриат ФИТ НГУ и хочу оформить договор дистанционно.
- id: nsu-summer-bachelor-07
  question: Что надо взять из военкомата?
  reference_answer: 'Для военнообязанного в перечне документов на заселение НГУ указан документ
    воинского учёта: приписное свидетельство или военный билет. Это альтернативы по вашей
    категории, а не требование принести оба документа.'
  topic: military_document_for_dorm
  source: https://education.nsu.ru/freshmen/
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: военнообязанный первокурсник НГУ собирает документы для заселения.
    Нужен документ воинского учёта: приписное свидетельство или военный билет в зависимости
    от категории. Не требовать оба сразу; не путать с выдаваемой университетом справкой об
    обучении для отсрочки. Не придумывать требование сняться с учёта, точные сроки или медицинские
    процедуры. Общий ответ «обратитесь в военкомат» без названия документа не проходит.'
  min_score: 4
  history:
  - role: user
    content: Я военнообязанный первокурсник НГУ. Собираю документы для заселения в общежитие.
