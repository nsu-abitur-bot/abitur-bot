scenarios:
- id: nsu-summer-bachelor-01
  question: Есть две программы с одинаковым кодом. Это разные программы или одна?
  reference_answer: 'Это два разных профиля одного направления 09.03.01 «Информатика и вычислительная
    техника»: «Программная инженерия и компьютерные науки» (ПИиКН) и «Компьютерные науки и
    системотехника» (КНиС). Одинаковый код не делает их одной программой.'
  topic: program_identity
  source: https://education.nsu.ru/information-technologies/
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: выбирает ПИиКН и КНиС на ФИТ НГУ. Нужны факты: два разных профиля
    одного направления; код 09.03.01; направление «Информатика и вычислительная техника».
    Нельзя объявлять конкурс общим или раздельным на основании одного кода. Содержательный
    ответ обязателен; просьба уточнить вместо этих фактов не проходит. Допустимы разные названия/порядок
    перечисления профилей.'
  min_score: 4
  history:
  - role: user
    content: Я выбираю между ПИиКН и КНиС на ФИТ НГУ.
- id: nsu-summer-bachelor-03
  question: Как заключить договор на платное обучение?
  reference_answer: 'Договор на платное обучение ФИТ можно оформить дистанционно: напишите
    в приёмную комиссию ФИТ на fit_prkom@nsu.ru по вопросу заключения договора. Для очного
    оформления на странице ФИТ указан кабинет 1132 учебного корпуса №1, Пирогова, 1. Дальнейшие
    документы и порядок подписания нужно согласовать с комиссией; на странице нет полного
    дистанционного регламента.'
  topic: paid_contract
  source: https://education.nsu.ru/apply_fit
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: поступающий на бакалавриат ФИТ хочет дистанционный договор. Обязательны
    возможность дистанционного оформления и конкретный адрес fit_prkom@nsu.ru для обращения
    по договору. Кабинет и адрес очного оформления допустимы, но необязательны. Нельзя придумывать
    перечень документов, срок подписания, обязательный очный визит или обещать зачисление.
    Один ответ «уточните в комиссии» без возможности дистанционного договора и адреса не проходит.'
  min_score: 4
  history:
  - role: user
    content: Я поступаю на бакалавриат ФИТ НГУ и хочу оформить договор дистанционно.
- id: nsu-summer-bachelor-04
  question: 'Как происходит заселение: сначала к ответственному сотруднику факультета или
    к заведующему общежитием?'
  reference_answer: 'Сначала получите и заполните заявление на проживание в кабинете 1112
    Учебного корпуса №1: Пирогова, 1, вход №1 из внутреннего дворика. Затем идите к заведующему
    общежитием — заключить договор найма и получить направление на проживание. То есть начинать
    нужно с оформления заявления на факультете, а не сразу с заселения у заведующего.'
  topic: dorm_initial_sequence
  source: https://www.nsu.ru/n/information-technologies-department/students/freshmen/campus.php
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Обязательны два последовательных действия: сначала заявление в кабинете
    1112 Учебного корпуса №1, затем договор найма/направление у заведующего общежитием. Нельзя
    поменять порядок, отправить сразу за ключами или выдумать сотрудника. Дополнительные шаги
    полного гайда допустимы, но не обязательны. Адрес без порядка действий не проходит.'
  min_score: 4
  history:
  - role: user
    content: Я первокурсник бакалавриата ФИТ НГУ, заселяюсь по инструкции 2026/2027 учебного
      года. Документы на проживание ещё не оформлял.
- id: nsu-summer-bachelor-05
  question: Как организованы занятия, есть лекции и семинары?
  reference_answer: В учебном плане ПИиКН 2026 предусмотрены лекции, практические занятия,
    лабораторные работы и самостоятельная работа. Конкретное сочетание зависит от дисциплины;
    практические занятия могут называться семинарами. Точное расписание нужно смотреть для
    своей группы.
  topic: study_formats
  source: https://www.nsu.ru/n/information-technologies-department/education_fit/programs/OOP/09-03-01/piikn/UP_09.03.01_2026_PIiKN.pdf
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Нужен содержательный ответ: есть лекционные и практические/семинарские
    занятия, лабораторные и самостоятельная работа; формы зависят от дисциплины. Не обещать
    одинаковую структуру всех предметов и не придумывать конкретное расписание. Одно перенаправление
    к расписанию вместо ответа о формах занятий не проходит.'
  min_score: 4
  history:
  - role: user
    content: Я поступил на ПИиКН ФИТ НГУ в 2026 году.
- id: nsu-summer-bachelor-06
  question: Есть ли в группе организатор, к которому можно обратиться за помощью, например
    если заболел?
  reference_answer: 'В группе есть староста: он связывает группу с преподавателями, куратором
    и деканатом. При болезни нужно предупредить деканат, старосту и куратора. После выздоровления
    оригинал справки нужно передать в деканат в течение двух дней; копию — преподавателям
    физкультуры.'
  topic: group_support_illness
  source: https://www.nsu.ru/n/information-technologies-department/students/pervokursnikam-bak.pdf
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: Обязательны староста как организатор/связующее лицо и уведомление деканата,
    старосты и куратора при болезни. Условие о справке и сроке два дня допустимо, но не обязательно
    для вопроса об организаторе; если названо, должно соответствовать слайдам. Не выдумывать
    имя или личный контакт старосты, не утверждать, что достаточно уведомить только одного
    человека.
  min_score: 4
  history:
  - role: user
    content: Я первокурсник бакалавриата ФИТ НГУ в 2026 году.
- id: nsu-summer-bachelor-07
  question: Что надо взять из военкомата?
  reference_answer: По инструкции заселения ФИТ приписное свидетельство или справку о постановке
    на воинский учёт нужно получить в военкомате по месту жительства. Для тех, у кого уже
    есть военный билет, он также указан в перечне документов на заселение. Не нужно получать
    все эти документы одновременно.
  topic: military_document_for_dorm
  source: https://www.nsu.ru/n/information-technologies-department/students/freshmen/campus.php
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Контекст: военнообязанный первокурсник ФИТ собирает документы на заселение
    до приезда. По специальной инструкции ФИТ подходят приписное свидетельство или справка
    о постановке на воинский учёт из военкомата по месту жительства; военный билет допустим
    для соответствующей категории. Один подходящий вариант с правильным контекстом достаточен,
    не требовать все три. Нельзя отклонять справку о постановке на учёт как неверный ответ.
    Не путать её со справкой НГУ об обучении для отсрочки. Не придумывать снятие с учёта,
    медицинские процедуры или дополнительные справки.'
  min_score: 4
  history:
  - role: user
    content: Я военнообязанный первокурсник ФИТ НГУ, заселяюсь в общежитие в 2026 году. Собираю
      документы до приезда.
- id: nsu-summer-bachelor-08
  question: Как проходят занятия физкультурой?
  reference_answer: Для практических занятий студентов распределяют в основное, специальное
    или спортивное учебное отделение. Распределение проходит в начале учебного года после
    медицинского обследования, с учётом здоровья и подготовленности. Для зачёта учитываются
    посещение занятий и выполнение требований своей программы; они различаются по отделениям.
  topic: physical_education
  source: https://www.nsu.ru/n/life/sport/fisculture/
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Нужны содержательные сведения: основное/специальное/спортивное отделения,
    распределение после медицинского обследования, зачёт по посещению и требованиям отделения.
    Не обещать свободный выбор любого спорта независимо от здоровья и не давать одинаковые
    нормативы всем студентам. Не придумывать своё расписание или освобождение от зачёта.'
  min_score: 4
  history:
  - role: user
    content: Я первокурсник НГУ. Спрашиваю об организации обязательных занятий физкультурой.
- id: nsu-summer-master-09
  question: Какие документы надо принести в приёмную комиссию кроме паспорта и СНИЛС?
  reference_answer: Кроме паспорта и СНИЛС нужны заявление о приёме, согласие на обработку
    персональных данных, документ о высшем образовании и фотографии 3×4 (на странице приёма
    указаны четыре). При смене ФИО нужен подтверждающий документ; документы об индивидуальных
    достижениях подают при их наличии/для участия в соответствующем конкурсе. Документ об
    инвалидности или ОВЗ нужен, если требуется создание специальных условий испытаний.
  topic: master_documents
  source: https://www.nsu.ru/n/education/apply/master-s-degree/
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: 'Обязательны заявление, согласие на обработку ПД, документ о высшем образовании
    и фотографии. Четыре фотографии 3×4 соответствуют центральной странице; точное число необязательно
    для зачёта. Условные документы нельзя объявлять обязательными для каждого: смена ФИО,
    достижения, специальные условия. Не добавлять медицинскую справку, ИНН или обязательный
    научный реферат на основании перечня другого факультета.'
  min_score: 4
  history:
  - role: user
    content: Я гражданин РФ, поступаю в магистратуру НГУ в 2026 году и подаю документы лично.
      Паспорт и СНИЛС у меня есть.
- id: nsu-summer-master-10
  question: До какого числа принимают документы?
  reference_answer: На основном приёме в магистратуру на бюджет документы принимают с 20 июня
    по 7 августа 2026 года. Это срок подачи документов, а не дата согласия на зачисление или
    приказа.
  topic: master_application_deadline
  source: https://www.nsu.ru/upload/iblock/498/yk2tj4zyuk08dfr6jtzlanyaf5m086f7/Правила приема
    в НГУ на первый курс по программам магистратуры в 2026 году.pdf
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: Обязателен срок завершения основного приёма документов на бюджет 7 августа
    2026 года. Начало 20 июня допустимо, но необязательно. Не заменять дату сроком согласия
