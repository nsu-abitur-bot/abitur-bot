      а не дополнительном наборе.
- id: nsu-summer-phd-12
  question: Какие документы нужны для поступления?
  reference_answer: 'По Правилам приёма в аспирантуру НГУ 2026 нужны заявление, документ о
    личности и гражданстве, диплом специалиста или магистра, СНИЛС при наличии, согласие на
    обработку персональных данных, портфолио научных достижений, согласие научного руководителя
    и три фотографии 3×4. Подтверждения дополнительных индивидуальных достижений — по усмотрению
    поступающего; документ об ОВЗ — при необходимости специальных условий. На обзорной странице
    есть расхождение по числу фотографий: там указаны шесть, тогда как п. 23 Правил 2026 требует
    три; при практической подаче стоит сверить это с приёмной комиссией.'
  topic: phd_documents
  source: https://www.nsu.ru/upload/iblock/15a/ivca4h90y5m9zo4ne3ccfyaz2bscye7g/Правила приема
    2026_аспирантура (1).pdf
  approved_by: null
  approved_at: null
  requires_llm: true
  assertions: []
  judge_criteria: Обязательны документ о личности, высшее образование уровня специалиста/магистра,
    согласие на обработку ПД, портфолио и согласие научного руководителя; СНИЛС при наличии
    и фотографии. Если называется число фотографий по Правилам 2026, это три 3×4; допустимо
    отдельно отметить противоречие обзорной страницы (шесть) и необходимость уточнения перед
    подачей. Нельзя выдавать шесть как требование п. 23, требовать от каждого справку об ОВЗ
    или целевой договор. Общий совет обратиться в комиссию без самого перечня не проходит.
  min_score: 4
  history:
  - role: user
    content: Я гражданин РФ, поступаю в аспирантуру НГУ в 2026 году по общему конкурсу. Хочу
      знать перечень по Правилам приёма.
