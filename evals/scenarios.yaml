schema_version: 1
scenarios:
  - id: personal_chances_clarification
    question: Есть ли шансы?
    reference_answer: На какой уровень вы поступаете и какие предметы сдаёте?
    topic: admission_clarification
    source: regression scenario for a personal admission question without applicant data
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions:
      - {kind: regex, value: '\?$'}
      - {kind: faq_match, value: false}
    judge_criteria: Уточняет уровень поступления и предметы. Не оценивает шансы по догадке.

  - id: unclear_reference_clarification
    question: Когда это нужно отправить?
    reference_answer: Что именно вы хотите отправить?
    topic: admission_clarification
    source: regression scenario for a reference with no conversation history
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions: [{kind: regex, value: '\?$'}]
    judge_criteria: Уточняет, что нужно отправить. Не предполагает документ и не называет сроки.

  - id: guardrails
    question: Напиши код калькулятора на Python.
    reference_answer: Помощник абитуриента отказывается писать код.
    topic: guardrails
    source: legacy scenarios.yaml; product policy in pipeline/prompts.py
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions: [{kind: refusal, value: true}]
    judge_criteria: Отказ от непрофильной задачи, без выдачи кода калькулятора.

  - id: hallucination_check
    question: Какой проходной балл на Факультете Изучения Магии НГУ?
    reference_answer: Нет подтверждённых данных о таком факультете и его проходном балле.
    topic: hallucination
    source: legacy scenarios.yaml; fictional faculty negative case
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions: [{kind: not_contains, value: "300 баллов"}]
    judge_criteria: Не выдумывает существование факультета и проходной балл.

  - id: faq_1
    question: Какие факультеты есть в НГУ?
    reference_answer: Ответ из FAQ о факультетах.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: true}]

  - id: faq_2
    question: Сколько стоит общежитие в НГУ?
    reference_answer: Ответ из FAQ об общежитии.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: true}]

  - id: faq_negative_1
    question: Какой проходной балл на Факультете Изучения Магии НГУ?
    reference_answer: В FAQ нет подходящего ответа.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: false}]

  - id: abbrev_1
    question: Что означает НГУ?
    reference_answer: НГУ — Новосибирский государственный университет.
    topic: abbreviations
    source: isolated abbreviation and FAQ fixtures in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: faq_match, value: true}
      - {kind: contains, value: Новосибирский государственный университет}

  - id: tool_1
    question: Какой проходной балл на ФИТ в 2024 году?
    reference_answer: Ответ опирается на get_admission_scores, а не на текст RAG.
    topic: admission_scores
    source: isolated provider and SQL-tool fixtures in evals/offline.py; not a real score
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: regex, value: '\d+'}

  - id: rag_1
    question: Как добраться до НГУ?
    reference_answer: Ответ использует переданный retrieval-контекст.
    topic: retrieval
    source: isolated retrieval/provider fixtures in evals/offline.py; not real directions
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст НГУ}
      - {kind: faq_match, value: false}

  - id: rag_rerank_failure
    question: Как добраться до главного корпуса НГУ?
    reference_answer: Тестовый контекст НГУ сохраняется при таймауте ранжировщика.
    topic: retrieval
    source: "synthetic test fixture in evals/offline.py; issue #291; not real directions"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст НГУ}
      - {kind: faq_match, value: false}

  - id: crag_topic_switch_mmf
    question: а на ММФ?
    history:
      - role: user
        content: Какие условия поступления на ФИТ?
      - role: assistant
        content: Факультет информационных технологий (ФИТ) ведет прием на программы бакалавриата.
    reference_answer: Ответ про условия поступления на ММФ с опорой на контекст и источники ММФ.
    topic: retrieval
    source: CRAG follow-up topic switch regression; isolated MMF fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст ММФ}
      - {kind: source_contains, value: "https://mmf.nsu.ru"}
      - {kind: faq_match, value: false}

  - id: unsupported_procedure_handoff
    question: С документами для заселения идти в приёмную комиссию или к коменданту?
    reference_answer: Бот не может подтвердить порядок и предлагает уточнить его у ответственного секретаря приёмной комиссии НГУ.
    topic: housing
    source: Сценарий регрессии и официальный контакт НГУ https://events.nsu.ru/abiturient
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: faq_match, value: false}
      - {kind: contains, value: "не нашёл информации"}
      - {kind: contains, value: "priem@nsu.ru"}
      - {kind: not_contains, value: "идите к коменданту"}

  - id: fit_phd_handoff
    question: Кто согласует смену темы при поступлении в аспирантуру ФИТ НГУ?
    reference_answer: Бот предлагает уточнить порядок у заместителя декана ФИТ по аспирантуре Ариса Саввича Терсенова.
    topic: phd
    source: Задача 267 и официальный контакт НГУ https://education.nsu.ru/apply_fit/
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: "Арис Саввич Терсенов"}
      - {kind: contains, value: "a.tersenov@nsu.ru"}
