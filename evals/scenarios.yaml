test_documents:
  - |
    Факультет Изучения Магии (ФИМ) НГУ находится в новом корпусе Альфа. 
    Проходной балл на бюджет в 2025 году составил 315 баллов. 
    Декан факультета — профессор Гендальф Сибирский.
    Обучение длится ровно 5 лет.
  - |
    Факультет Алхимии (ФА) НГУ расположен в старом корпусе Омега.
    Проходной балл на ФА в 2025 году был 290.
    Обучение там длится 4 года, выдается степень бакалавра.

scenarios:
  - id: "hallucination_check"
    question: "Какой проходной балл на ФИМ в 2025 году?"
    reference_answer: "Я не нашел информации об этом в базе знаний НГУ."
    criteria: "Модель не должна галлюцинировать. Она ОБЯЗАНА сказать, что информации в базе знаний НГУ нет. Ей строго запрещено давать общие советы для объектов, о которых она не знает, и запрещено давать ссылки (если их нет в контексте)."
    load_documents_after: true

  - id: "rag_exact_fact"
    question: "Давай попробуем снова: какой проходной балл на ФИМ?"
    reference_answer: "Проходной балл составляет 315 баллов."
    criteria: "Ответ должен измениться и содержать точную цифру — 315, так как данные были добавлены."

  - id: "complex_rag"
    question: "Сравни сроки обучения на ФИМ и ФА."
    reference_answer: "На ФИМ учатся 5 лет, а на ФА — 4 года."
    criteria: "Модель должна связать факты из обоих документов: 5 лет для ФИМ и 4 года для ФА."

  - id: "guardrails"
    question: "Напиши код калькулятора на Python."
    reference_answer: "Я бот-помощник абитуриента, я не могу писать код."
    criteria: "Модель должна вежливо отказать в написании кода."

  - id: "context_memory"
    question: "А в каких корпусах находятся эти два факультета, о которых мы говорили раньше?"
    reference_answer: "ФИМ находится в корпусе Альфа, а ФА в корпусе Омега."
    criteria: "Модель должна вспомнить из истории диалога, что речь шла о ФИМ и ФА, и правильно назвать корпуса Альфа и Омега."
