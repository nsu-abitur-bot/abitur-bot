schema_version: 1
scenarios:
  - id: guardrails
    question: Напиши код калькулятора на Python.
    reference_answer: Помощник абитуриента отказывается писать код.
    topic: guardrails
    source: legacy scenarios.yaml; product policy in pipeline/prompts.py
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions: [{kind: refusal, value: true}]
    judge_criteria: Отказ от непрофильной задачи, без выдачи кода калькулятора.

  - id: hallucination_check
    question: Какой проходной балл на Факультете Изучения Магии НГУ?
    reference_answer: Нет подтверждённых данных о таком факультете и его проходном балле.
    topic: hallucination
    source: legacy scenarios.yaml; fictional faculty negative case
    approved_by: null
    approved_at: null
    requires_llm: true
    assertions: [{kind: not_contains, value: "300 баллов"}]
    judge_criteria: Не выдумывает существование факультета и проходной балл.

  - id: faq_1
    question: Какие факультеты есть в НГУ?
    reference_answer: Ответ из FAQ о факультетах.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: true}]

  - id: faq_2
    question: Сколько стоит общежитие в НГУ?
    reference_answer: Ответ из FAQ об общежитии.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: true}]

  - id: faq_negative_1
    question: Какой проходной балл на Факультете Изучения Магии НГУ?
    reference_answer: В FAQ нет подходящего ответа.
    topic: faq
    source: legacy scenarios.yaml; isolated FAQ fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions: [{kind: faq_match, value: false}]

  - id: abbrev_1
    question: Что означает НГУ?
    reference_answer: НГУ — Новосибирский государственный университет.
    topic: abbreviations
    source: isolated abbreviation and FAQ fixtures in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: faq_match, value: true}
      - {kind: contains, value: Новосибирский государственный университет}

  - id: tool_1
    question: Какой проходной балл на ФИТ в 2024 году?
    reference_answer: Ответ опирается на get_admission_scores, а не на текст RAG.
    topic: admission_scores
    source: isolated provider and SQL-tool fixtures in evals/offline.py; not a real score
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: regex, value: '\d+'}

  - id: rag_1
    question: Как добраться до НГУ?
    reference_answer: Ответ использует переданный retrieval-контекст.
    topic: retrieval
    source: isolated retrieval/provider fixtures in evals/offline.py; not real directions
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст НГУ}
      - {kind: faq_match, value: false}

  - id: admission_score_study_forms
    question: Какой проходной балл на программе «Тестовая инженерия» в 2024 году?
    reference_answer: Очная — бюджет 255, платно 212. Заочная — бюджет 224, платно 181.
    topic: admission_scores
    source: "Синтетические баллы для регрессии #482 из evals/offline.py"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: contains, value: "очная, бюджет: проходной 255"}
      - {kind: contains, value: "очная, платно: проходной 212"}
      - {kind: contains, value: "заочная, бюджет: проходной 224"}
      - {kind: contains, value: "заочная, платно: проходной 181"}

  - id: admission_score_pair_passing
    question: Какой проходной балл на 09.03.01?
    reference_answer: Тестовая системотехника, 2024 год, бюджет. Проходной 141, средний 63.27.
    topic: admission_scores
    source: Синтетическая запись в evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: contains, value: Тестовая системотехника}
      - {kind: contains, value: "2024, форма обучения не указана, бюджет: проходной 141, средний 63.27"}

  - id: admission_score_pair_general
    question: Какие баллы на 09.03.01?
    reference_answer: Тестовая системотехника, 2024 год, бюджет. Проходной 141, средний 63.27.
    topic: admission_scores
    source: Синтетическая запись в evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: contains, value: Тестовая системотехника}
      - {kind: contains, value: "2024, форма обучения не указана, бюджет: проходной 141, средний 63.27"}

  - id: admission_score_pair_followup
    question: А средний балл какой?
    history:
      - {role: user, content: "Какие баллы на 09.03.01?"}
      - {role: assistant, content: "Тестовая системотехника, 2024, бюджет. Проходной 141, средний 63.27."}
    reference_answer: Средний балл 63.27.
    topic: admission_scores
    source: Синтетическая запись и восстановительный вызов в evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: contains, value: "средний 63.27"}
      - {kind: not_contains, value: Среднего балла в базе нет}

  - id: admission_announced_seats
    question: Сколько бюджетных мест на очной и заочной формах на программе «Тестовая инженерия» в 2025 году?
    reference_answer: На программе «Тестовая инженерия» в 2025 году объявлено 0 бюджетных мест на очной форме. Показана ссылка на источник. По заочной форме количество неизвестно.
    topic: admission_scores
    source: "Синтетические данные для регрессии #483 из evals/offline.py"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: tool_called, value: get_admission_scores}
      - {kind: contains, value: Тестовая инженерия}
      - {kind: contains, value: "2025, очная, бюджет: объявлено мест: 0"}
      - {kind: contains, value: "2025, заочная, бюджет: нет данных о количестве мест"}
      - {kind: contains, value: "https://example.test/admission-2025"}
      - {kind: not_contains, value: "гарантировано"}

  - id: rag_rerank_failure
    question: Как добраться до главного корпуса НГУ?
    reference_answer: Тестовый контекст НГУ сохраняется при таймауте ранжировщика.
    topic: retrieval
    source: "synthetic test fixture in evals/offline.py; issue #291; not real directions"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст НГУ}
      - {kind: faq_match, value: false}

  - id: crag_topic_switch_mmf
    question: а на ММФ?
    history:
      - role: user
        content: Какие условия поступления на ФИТ?
      - role: assistant
        content: Факультет информационных технологий (ФИТ) ведет прием на программы бакалавриата.
    reference_answer: Ответ про условия поступления на ММФ с опорой на контекст и источники ММФ.
    topic: retrieval
    source: CRAG follow-up topic switch regression; isolated MMF fixture in evals/offline.py
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: Тестовый контекст ММФ}
      - {kind: source_contains, value: "https://mmf.nsu.ru"}
      - {kind: faq_match, value: false}

  - id: dialog_scope_fresh
    question: Когда начинается приём на «Бизнес-информатика» на бюджет в 2026 году?
    reference_answer: До 18 июля. Источник — запись о сроке приёма.
    topic: retrieval
    source: "Синтетическая БЗ #481, контроль в свежей сессии"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: до 18 июля}
      - {kind: source_contains, value: "https://example.test/dialog/deadline"}

  - id: dialog_scope_switch
    setup_questions:
      - Когда начинается приём в магистратуру ФИТ?
    question: Когда начинается приём на «Бизнес-информатика» на бюджет в 2026 году?
    reference_answer: До 18 июля. Источник — запись о сроке приёма.
    topic: retrieval
    source: "Синтетическая БЗ #481, смена темы после ответа об отсутствии данных"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: до 18 июля}
      - {kind: source_contains, value: "https://example.test/dialog/deadline"}

  - id: dialog_scope_documents
    setup_questions:
      - Когда начинается приём в магистратуру ФИТ?
      - Когда начинается приём на «Бизнес-информатика» на бюджет в 2026 году?
      - А на платное?
      - А в другом году?
    question: А какие документы нужны?
    reference_answer: Нужно согласие на зачисление. Источник — запись о документах программы.
    topic: retrieval
    source: "Синтетическая БЗ #481, дополнительные сведения в той же сессии"
    approved_by: null
    approved_at: null
    requires_llm: false
    assertions:
      - {kind: contains, value: согласие на зачисление}
      - {kind: source_contains, value: "https://example.test/dialog/documents"}
