# FAQ — заготовленные вопросы и ответы для бота абитуриентов НГУ
# Формат: список пар question/answer.
# Можно указывать aliases — альтернативные формулировки вопроса
# для улучшения точности семантического поиска.
#
# Порог сходства настраивается в faq_matcher.py (по умолчанию 0.85).

faq:
  # ──────────── Общие вопросы об НГУ ────────────

  - question: "Когда был основан НГУ?"
    aliases:
      - "В каком году основали НГУ?"
      - "Год основания Новосибирского государственного университета"
    answer: >
      НГУ был создан в 1958 году по постановлению Совета Министров СССР.
      Занятия начались осенью 1959 года — первая лекция была прочитана
      29 сентября 1959 г.

  - question: "Какие факультеты есть в НГУ?"
    aliases:
      - "Список факультетов НГУ"
      - "Факультеты и институты НГУ"
      - "Какие направления обучения есть в НГУ?"
    answer: >
      Основные факультеты и институты НГУ:
      • Механико-математический факультет (ММФ)
      • Физический факультет (ФФ)
      • Факультет естественных наук (ФЕН)
      • Факультет информационных технологий (ФИТ)
      • Геолого-геофизический факультет (ГГФ)
      • Экономический факультет
      • Гуманитарный институт
      • Институт медицины и психологии им. В. Зельмана
      • Институт интеллектуальной робототехники
      • Институт философии и права

  - question: "Где находится НГУ?"
    aliases:
      - "Адрес НГУ"
      - "В каком городе находится НГУ?"
    answer: >
      НГУ расположен в Академгородке — научном центре на юге Новосибирска.

  # ──────────── Общежития ────────────

  - question: "Есть ли общежитие в НГУ?"
    aliases:
      - "Общежитие НГУ"
      - "Можно ли жить в общежитии?"
      - "Предоставляет ли НГУ общежитие?"
    answer: >
      Да, студенты НГУ могут проживать в университетских общежитиях
      в Академгородке. Они расположены примерно в 10 минутах ходьбы
      от учебных корпусов. Комнаты двухместные, есть кухни, прачечные,
      хранение багажа и доступ в интернет (NSU-сетка).

  - question: "Сколько стоит общежитие в НГУ?"
    aliases:
      - "Стоимость проживания в общежитии НГУ"
      - "Цена за общежитие"
    answer: >
      Минимальная стоимость проживания в общежитии НГУ — от 1 600 рублей
      в месяц. Плата за интернет оплачивается отдельно. Аренда квартиры
      в Академгородке — примерно от 25 000 ₽ в месяц.

  # ──────────── ФИТ ────────────

  - question: "Какие ЕГЭ нужны на ФИТ?"
    aliases:
      - "Экзамены для поступления на ФИТ"
      - "Что сдавать на ФИТ НГУ?"
      - "Какие предметы ЕГЭ на факультет информационных технологий?"
    answer: >
      Для поступления на ФИТ НГУ нужны ЕГЭ:
      • Русский язык (обязательный)
      • Математика профильная (обязательный)
      • Физика или Информатика/ИКТ (на выбор)
      Минимальный балл по каждому предмету — 50.

  - question: "Какой проходной балл на ФИТ?"
    aliases:
      - "Проходной балл на факультет информационных технологий"
      - "Сколько баллов нужно на ФИТ?"
      - "Проходной балл ФИТ НГУ"
    answer: >
      Проходной балл на ФИТ НГУ (направление 09.03.01 «Информатика
      и вычислительная техника», бюджет) составляет примерно 267 баллов
      (данные 2025 года). Стоимость платного обучения — от ~195 000 ₽/год.

  - question: "Сложно ли поступить на ФИТ?"
    aliases:
      - "Трудно ли поступить на ФИТ НГУ?"
      - "Высокий ли конкурс на ФИТ?"
    answer: >
      Да, конкурс на ФИТ НГУ высокий — проходной балл около 267. Это один
      из самых популярных факультетов. Рекомендуется серьёзно готовиться
      к ЕГЭ по математике и информатике/физике.

  - question: "Нужно ли уметь программировать для поступления на ФИТ?"
    aliases:
      - "Нужен ли опыт программирования для ФИТ?"
      - "Нужно ли знать программирование перед поступлением на ФИТ?"
    answer: >
      Начальный опыт программирования желателен, но факультет готовит
      с нуля — базовая подготовка предусмотрена в учебном плане.

  # ──────────── ММФ ────────────

  - question: "Какие ЕГЭ нужны на ММФ?"
    aliases:
      - "Экзамены для поступления на ММФ"
      - "Что сдавать на ММФ НГУ?"
      - "Какие предметы ЕГЭ на механико-математический?"
    answer: >
      Для поступления на ММФ НГУ нужны ЕГЭ:
      • Русский язык (обязательный)
      • Математика профильная (обязательный)
      • Информатика/ИКТ или Физика (на выбор, зависит от направления)

  - question: "Какой проходной балл на ММФ?"
    aliases:
      - "Проходной балл на механико-математический факультет"
      - "Сколько баллов нужно на ММФ?"
    answer: >
      Проходные баллы на ММФ НГУ (данные 2025 года):
      • «Математика и компьютерные науки» (02.03.01) — ~239 баллов на бюджет
      • «Механика и математическое моделирование» — ~232 балла на бюджет
      Стоимость платного обучения — от ~200 000 ₽/год.

  # ──────────── Экономический факультет ────────────

  - question: "Какие ЕГЭ нужны на экономический факультет?"
    aliases:
      - "Экзамены для поступления на экономфак НГУ"
      - "Что сдавать на экономический?"
    answer: >
      Для поступления на Экономический факультет НГУ нужны ЕГЭ:
      • Русский язык
      • Математика
      • Обществознание (или история/иностранный язык)

  - question: "Сколько стоит обучение на экономическом факультете?"
    aliases:
      - "Стоимость обучения на экономфаке НГУ"
      - "Цена за платное обучение на экономическом"
    answer: >
      Стоимость платного обучения на Экономическом факультете НГУ
      составляет примерно 112 000–125 000 рублей за семестр.

  # ──────────── Документы и поступление ────────────

  - question: "Какие документы нужны для поступления?"
    aliases:
      - "Список документов для поступления в НГУ"
      - "Что нужно подать для поступления?"
      - "Документы для приёмной комиссии"
    answer: >
      Для поступления в НГУ, как правило, нужны:
      • Заявление о приёме
      • Паспорт (копия)
      • Аттестат о среднем образовании
      • Результаты ЕГЭ
      • Фотографии
      • Медицинская справка (для некоторых направлений)
      Точный перечень уточняйте на сайте приёмной комиссии НГУ.

  - question: "Когда начинается приём документов?"
    aliases:
      - "Сроки подачи документов в НГУ"
      - "До какого числа можно подать документы?"
      - "Когда подавать документы в НГУ?"
    answer: >
      Приём документов в НГУ обычно начинается 20 июня и заканчивается
      25 июля для очной формы. Точные даты могут отличаться — следите
      за информацией на официальном сайте приёмной комиссии НГУ.
