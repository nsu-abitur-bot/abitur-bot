[project]
name = "abitur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff",
    "aiogram",
    "python-dotenv",
    "httpx",
    "bs4>=0.0.2",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "redis>=7.0.1",
    "langchain-community>=0.4",
    "sentence-transformers>=5.1.1",
    "langchain-huggingface>=1.0.0",
    "chromadb>=1.2.1",
    "langchain-chroma>=1.0.0",
    "langchain-core>=0.3.79",
    "langchain-openai>=0.3.35",
    "langchain>=1.0.3",
    "langchain-text-splitters>=1.0.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.17.1",
    "uuid6>=2024.1.12",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "fakeredis[asyncio]"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["asyncio: mark test as async"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
fix = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
