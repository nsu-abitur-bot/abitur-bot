[project]
name = "abitur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "aiogram",
    "python-dotenv",
    "httpx",
    "bs4>=0.0.2",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "redis>=7.0.1",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "chromadb>=1.2.1",
    "langchain-chroma>=0.1.0",
    "langchain-core>=0.3.79",
    "langchain-openai>=0.3.35",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.17.1",
    "uuid6>=2024.1.12",
    "chonkie>=1.4.2",
    "psycopg2>=2.9.11",
    "langchain-gigachat>=0.3.12",
    "lightrag-hku>=1.4.9.8",
    "cerebras-cloud-sdk>=1.54.0",
    "google-genai>=1.56.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "fakeredis[asyncio]",
    "pyrefly>=0.56.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["asyncio: mark test as async"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
fix = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
